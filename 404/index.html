  <script>
    document.querySelectorAll('.theme-toggle').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var root = document.documentElement;
        var current = root.getAttribute('data-theme');
        var isDark = current ? current === 'dark' : window.matchMedia('(prefers-color-scheme: dark)').matches;
        var next = isDark ? 'light' : 'dark';
        root.setAttribute('data-theme', next);
        localStorage.setItem('theme', next);
      });
    });
  </script>

  <script>
    (function () {
      var bar = document.querySelector('.progress-bar');
      var nav = document.querySelector('nav.main-nav.has-hero');
      var hero = document.querySelector('.profile #header');
      if (!bar && !(nav && hero)) return;
      var ticking = false;
      function update() {
        var doc = document.documentElement;
        var scrollable = doc.scrollHeight - doc.clientHeight;
        var pct = scrollable > 0 ? (doc.scrollTop / scrollable) * 100 : 0;
        if (bar) bar.style.width = pct + '%';
        if (nav && hero) {
          nav.classList.toggle('scrolled', hero.getBoundingClientRect().bottom < nav.offsetHeight);
        }
        ticking = false;
      }
      document.addEventListener('scroll', function () {
        if (!ticking) {
          requestAnimationFrame(update);
          ticking = true;
        }
      }, { passive: true });
      update();
    })();
  </script>
