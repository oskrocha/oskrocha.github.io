<nav class="main-nav{% if page.profile %} has-hero{% endif %}">

        <span>{{ site.short_name }}</span>
    </a>

    <div class="nav-links">
        <a href="{{ site.baseurl }}" class="icon-btn nav-home" aria-label="Home">

                <path d="M9 22V12h6v10"/>
            </svg>
        </a>

        {% if page.url == "/publications/" %}
        <span class="nav-current">Publications</span>
        {% else %}
        <a href="{{ site.baseurl }}publications">Publications</a>
        {% endif %}

        {% if page.url == "/teaching/" %}
        <span class="nav-current">Teaching</span>

        <a href="{{ site.baseurl }}teaching">Teaching</a>
        {% endif %}

        {% if page.url == "/scientific/" %}
        <span class="nav-current">Scientific Activities</span>
        {% else %}
        <a href="{{ site.baseurl }}scientific">Scientific Activities</a>
        {% endif %}
