<div class="profile">
    <section id="profile-wrapper">
        <header id="header">
            <svg class="motif" viewBox="0 0 400 200" aria-hidden="true" focusable="false">
                <line x1="40" y1="40" x2="120" y2="25" />
                <line x1="120" y1="25" x2="200" y2="60" />
                <line x1="200" y1="60" x2="280" y2="30" />
                <line x1="280" y1="30" x2="340" y2="80" />
                <line x1="40" y1="40" x2="90" y2="140" />
                <line x1="90" y1="140" x2="180" y2="150" />
                <line x1="180" y1="150" x2="200" y2="60" />
                <line x1="180" y1="150" x2="260" y2="130" />
                <line x1="260" y1="130" x2="320" y2="160" />
                <line x1="260" y1="130" x2="340" y2="80" />
                <circle cx="40" cy="40" r="3.5" />
                <circle cx="120" cy="25" r="3.5" />
                <circle cx="200" cy="60" r="3.5" />
                <circle cx="280" cy="30" r="3.5" />
                <circle cx="340" cy="80" r="3.5" />
                <circle cx="90" cy="140" r="3.5" />
                <circle cx="180" cy="150" r="3.5" />
                <circle cx="260" cy="130" r="3.5" />
                <circle cx="320" cy="160" r="3.5" />
            </svg>

        {% if site.aboutPage %}
            <a href="{{ site.baseurl }}about">
                <img id="avatar" class="2x" src="{{ site.baseurl }}assets/images/avatar.png" width="84" height="84" alt="{{ site.author }}"/>
            </a>
        {% else %}
            <img id="avatar" class="2x" src="{{ site.baseurl }}assets/images/avatar.png" width="84" height="84" alt="{{ site.author }}"/>
        {% endif %}
            <h1>{{ site.author }}</h1>
            <h2>{{ site.description }}</h2>
            <h2>{{ site.description2 }}</h2>
            <br>

            <a href="mailto:oskrocha@gmail.com">
                <i class="fa fa-envelope fa-2x"></i>
            </a>
            <a href="https://www.researchgate.net/profile/Oscar_Rodriguez_Rocha2">
                <i class="ai ai-researchgate-square fa-2x"></i>
            </a>
            <a href="http://orcid.org/0000-0003-2764-1134">
                <i class="ai ai-orcid-square fa-2x"></i>
            </a>
            <a href="https://scholar.google.com/citations?user=q6zhzr8AAAAJ&hl=en">
                <i class="ai ai-google-scholar-square fa-2x"></i>
            </a>
            <a href="https://fr.linkedin.com/in/oscarrodriguezrocha">
                <i class="fa fa-linkedin-square fa-2x"></i>
            </a>
            <a href="https://twitter.com/oscarrodriguez">
                <i class="fa fa-twitter-square fa-2x"></i>
            </a>
            <a href="https://instagram.com/psicosis/">
                <i class="fa fa-instagram fa-2x"></i>
            </a>

        </header>
    </section>
</div>
