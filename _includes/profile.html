<div class="profile">
    <section id="profile-wrapper">
        <header id="header">
            <!-- Hub-and-spoke: you're the connecting node, satellites are the
                 network. Hub sits behind the avatar, so it has no visible dot. -->
            <svg class="motif" viewBox="0 0 300 150" aria-hidden="true" focusable="false">
                <line x1="150" y1="75" x2="30" y2="45" style="animation-delay:0s" />
                <line x1="150" y1="75" x2="95" y2="12" style="animation-delay:.08s" />
                <line x1="150" y1="75" x2="200" y2="10" style="animation-delay:.16s" />
                <line x1="150" y1="75" x2="270" y2="50" style="animation-delay:.24s" />
                <line x1="150" y1="75" x2="255" y2="130" style="animation-delay:.32s" />
                <line x1="150" y1="75" x2="140" y2="142" style="animation-delay:.4s" />
                <line x1="150" y1="75" x2="45" y2="120" style="animation-delay:.48s" />
                <line x1="30" y1="45" x2="45" y2="120" style="animation-delay:.56s" />
                <line x1="95" y1="12" x2="200" y2="10" style="animation-delay:.64s" />
                <line x1="270" y1="50" x2="255" y2="130" style="animation-delay:.72s" />
                <circle cx="30" cy="45" r="3" style="animation-delay:.9s" />
                <circle cx="95" cy="12" r="2.5" style="animation-delay:.98s" />
                <circle cx="200" cy="10" r="4" style="animation-delay:1.06s" />
                <circle cx="270" cy="50" r="2.5" style="animation-delay:1.14s" />
                <circle cx="255" cy="130" r="3.5" style="animation-delay:1.22s" />
                <circle cx="140" cy="142" r="2.5" style="animation-delay:1.3s" />
                <circle cx="45" cy="120" r="3" style="animation-delay:1.38s" />
            </svg>

        {% if site.aboutPage %}
            <a href="{{ site.baseurl }}about">
                <img id="avatar" class="2x" src="{{ site.baseurl }}assets/images/avatar.png" width="84" height="84" alt="{{ site.author }}"/>
            </a>
        {% else %}
            <img id="avatar" class="2x" src="{{ site.baseurl }}assets/images/avatar.png" width="84" height="84" alt="{{ site.author }}"/>
        {% endif %}
            <h1>{{ site.author }}</h1>
            <h2>{{ site.description }}</h2>
            <h2>{{ site.description2 }}</h2>
            <br>

            <a href="mailto:oskrocha@gmail.com">
                <i class="fa fa-envelope fa-2x"></i>
            </a>
            <a href="https://www.researchgate.net/profile/Oscar_Rodriguez_Rocha2">
                <i class="ai ai-researchgate-square fa-2x"></i>
            </a>
            <a href="http://orcid.org/0000-0003-2764-1134">
                <i class="ai ai-orcid-square fa-2x"></i>
            </a>
            <a href="https://scholar.google.com/citations?user=q6zhzr8AAAAJ&hl=en">
                <i class="ai ai-google-scholar-square fa-2x"></i>
            </a>
            <a href="https://fr.linkedin.com/in/oscarrodriguezrocha">
                <i class="fa fa-linkedin-square fa-2x"></i>
            </a>
            <a href="https://twitter.com/oscarrodriguez">
                <i class="fa fa-twitter-square fa-2x"></i>
            </a>
            <a href="https://instagram.com/psicosis/">
                <i class="fa fa-instagram fa-2x"></i>
            </a>

        </header>
    </section>
</div>
